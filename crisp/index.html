        <h1>Crisp</h1>
        <p class="updated">Last updated: August 19, 2026</p>

        <h2>Privacy Policy</h2>
        <p>Crisp cleans up recordings entirely on your iPhone or iPad, using the audio frameworks built into iOS. Your recordings never leave your device.</p>
        <ul>
            <li><strong>No data collection.</strong> We do not collect personal information, usage data, analytics, or any identifiers.</li>
            <li><strong>No accounts.</strong> There's nothing to sign up for.</li>
            <li><strong>No uploads.</strong> Every recording is processed on-device. Nothing is sent to a server.</li>
            <li><strong>No third-party tracking.</strong> No SDKs, no telemetry, no ads.</li>
            <li><strong>No network requests.</strong> Crisp makes no network connections and works fully offline.</li>
        </ul>
        <p>Your recordings stay on your device. We never hear them.</p>

        <h2>Files You Choose</h2>
        <p>Crisp reads a recording only when you pick it yourself. It cannot browse your files on its own. The cleaned copy is written to a temporary working folder and is deleted when you process another recording or close the app — save or share it if you want to keep it.</p>
        <p>Crisp's own folder appears in Files under On My iPhone, so you can put recordings in and take them out without going through another app. Nothing in that folder is read unless you choose it.</p>

        <h2>Local Storage</h2>
        <p>Crisp stores nothing about you. There are no settings to remember, no history, and no usage counter. Whether you have unlocked unlimited recordings is held by the App Store, not by us.</p>

        <h2>Purchases</h2>
        <p>The one-time unlock is handled entirely by Apple through the App Store. We do not have access to your payment information. Apple's privacy policy governs these transactions.</p>

        <h2>Children's Privacy</h2>
        <p>Crisp does not collect any data from anyone, including children under 13.</p>

        <h2>Changes to This Policy</h2>
        <p>If we ever change this policy, we will update the date above. Given that we collect no data, we do not anticipate significant changes.</p>

        <h2>Common Questions</h2>

        <h3>What does Crisp actually do?</h3>
        <p>Four things, in order. It removes rumble below the range of a human voice and cuts the muddiness that builds up in small rooms. It lifts the frequencies that carry consonants, so words separate instead of blurring. It evens out the gap between your quiet words and your loud ones. Then it sets the overall volume to the level YouTube, Spotify and podcast apps expect, without letting anything clip.</p>

        <h3>What does "Just right" mean?</h3>
        <p>Streaming platforms turn everything down to roughly the same loudness before you hear it. If your recording is far below that level it arrives thin and quiet next to everything else; far above it and the platform turns it down anyway, so all you lose is dynamic range. "Just right" means Crisp has put you in the window those platforms aim for.</p>

        <h3>Why does the original sound so much quieter?</h3>
        <p>Because it usually was. A phone voice memo often sits far below broadcast level, and that gap is most of what Crisp fixes. Tap Original and Crisp back and forth while it plays — the switch is instant, so you are comparing the sounds rather than your memory of them.</p>

        <h3>Will it remove background noise?</h3>
        <p>Not on its own. Crisp is a levelling and tone tool, not a noise remover. It will make a noisy recording clearer and more consistent, but a fan or a busy street will still be there — and raising a quiet voice raises the room with it.</p>

        <h3>What file types can I use?</h3>
        <p>Anything iOS can open: WAV, M4A, MP3, AIFF, CAF and more. Crisp keeps the original sample rate and channel count and never resamples. The cleaned copy is written as a 24-bit WAV.</p>

        <h3>Is there a length limit?</h3>
        <p>Free covers recordings up to five minutes. The one-time unlock removes the limit. Long recordings are processed in pieces, so length does not affect memory.</p>

        <h3>Where does the cleaned copy go?</h3>
        <p>Nowhere until you say so. Tap Save a Copy to send it to Files, Messages, or any other app. Working copies are cleared automatically.</p>
